# ─────────────────────────────────────────────────────────────────────────────
# CI Pipeline — Ishan Chakraborty Portfolio
#
# Runs on every push to main and on pull requests targeting main.
# Performs:
#   1. Build verification (next build)
#   2. ESLint static analysis
#   3. Dependency vulnerability audit (npm audit)
#   4. Container / filesystem CVE scan (Trivy)
#   5. Secret detection (Gitleaks)
#   6. Accessibility audit (pa11y-ci against exported HTML)
#
# Actual production deployment is handled by Vercel's GitHub integration
# and fires automatically after this workflow passes.
# ─────────────────────────────────────────────────────────────────────────────

name: CI — Build, Lint, Security & Accessibility

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── 1. Build + Lint ─────────────────────────────────────────────────────────
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build (Next.js production build)
        run: npm run build

      # Upload the .next output so other jobs can reuse it
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 1

  # ── 2. Dependency Vulnerability Audit ───────────────────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail the job on high or critical vulnerabilities.
      # --audit-level=high blocks on severity >= high.
      - name: npm audit (high/critical severities)
        run: npm audit --audit-level=high

  # ── 3. Trivy CVE Scan (filesystem) ──────────────────────────────────────────
  trivy-scan:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          # Only fail on CRITICAL or HIGH findings; ignore unfixed
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Suppress noisy output — only show table summary
          format: table
          exit-code: 1

  # ── 4. Secret Detection (Gitleaks) ──────────────────────────────────────────
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history required for Gitleaks to scan all commits
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Accessibility Audit (pa11y-ci) ───────────────────────────────────────
  accessibility-audit:
    name: Accessibility Audit (pa11y-ci WCAG 2.1 AA)
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Install pa11y-ci and a lightweight static server
      - name: Install pa11y-ci and serve
        run: npm install --no-save pa11y-ci serve

      # Build a static export of the Next.js app
      - name: Build static export
        run: npx next build
        env:
          # Allow static export for pa11y; Vercel uses SSR in production
          NEXT_EXPORT: true

      # Serve the exported output on port 3000 and run pa11y against it
      - name: Serve static export and run pa11y-ci
        run: |
          npx serve out -p 3000 &
          SERVER_PID=$!
          sleep 5
          npx pa11y-ci \
            --standard WCAG2AA \
            --reporter cli \
            http://localhost:3000
          kill $SERVER_PID
        # Continue on pa11y violations so they are surfaced as a warning
        # rather than hard-blocking the deployment. Change `continue-on-error`
        # to `false` once all existing violations are resolved.
        continue-on-error: true

      # Upload pa11y report as an artefact
      - name: Save pa11y results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: pa11y-report.json
          retention-days: 7
          if-no-files-found: ignore
